name: Publish preverified Story-teaching implementation candidate
on:
  push:
    branches:
      - audit/publish-story-candidate-20261024
permissions:
  contents: write
jobs:
  precommit-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8c85fbe9bdf1c529bf2bd4e7ff23cfb85140a7ec
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply detached candidate blobs to uncommitted worktree
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const expected=[
            ['js/view.js','c4a84df26553967bb646d4f2ceaf54d77379e663'],
            ['tests/preanswer-category-leak.test.js','c3859586981403ce44d9406e6a146377d4d18f09'],
            ['package.json','b75d49b2f8feb6fe09b306426c76c1093ee3ed5b'],
            ['js/explanation-model.js','279b57c0facfb5d4ff5ba9d04c399663a9b996c7'],
            ['tests/exam-points-visible.test.js','927798b51fafb84ed2fc2627607bb0451ed12292'],
            ['tests/audit-matrix.test.js','944472a075e3e3bb2844bc19db4c5144233f06fd'],
            ['scripts/validate-category-successor.cjs','bbb0a46d647e926a3b47c829096b5d24fbefe795']
          ];
          (async()=>{
           const repo=process.env.GITHUB_REPOSITORY,token=process.env.GH_READ_TOKEN;
           if(!repo || !token) throw new Error('GitHub authentication unavailable');
           for(const [file,sha] of expected) {
             const res=await fetch('https://api.github.com/repos/'+repo+'/git/blobs/'+sha,{
               headers:{Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',Accept:'application/vnd.github+json'}
             });
             if(!res.ok)throw new Error(file+' blob fetch HTTP '+res.status+' '+(await res.text()).slice(0,200));
             const data=await res.json();
             const buf=Buffer.from(data.content.replace(/\s/g,''),'base64');
             const actual=crypto.createHash('sha1').update('blob '+buf.length+'\0').update(buf).digest('hex');
             if(actual!==sha||data.sha!==sha)throw new Error(file+' SHA-1 mismatch '+actual);
             fs.mkdirSync(require('node:path').dirname(file),{recursive:true});
             fs.writeFileSync(file,buf);
             console.log('APPLIED_UNCOMMITTED '+file+' blob='+sha+' bytes='+buf.length);
           }
           const changed=require('node:child_process').execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
           const expectedChanges=['js/view.js','js/explanation-model.js','package.json','tests/audit-matrix.test.js'].sort();
           if(JSON.stringify(changed)!==JSON.stringify(expectedChanges))throw new Error('unexpected tracked diff '+JSON.stringify(changed));
           if(!fs.existsSync('tests/preanswer-category-leak.test.js'))throw new Error('new test file missing');
          if(!fs.existsSync('tests/exam-points-visible.test.js'))throw new Error('new teaching test missing');
          if(!fs.existsSync('scripts/validate-category-successor.cjs'))throw new Error('strict new successor validation script missing');
           const p=JSON.parse(fs.readFileSync('package.json'));
           if(!p.scripts.test.startsWith('node tests/preanswer-category-leak.test.js && node tests/exam-points-visible.test.js && '))throw new Error('both new tests not in npm test');
           console.log('CANDIDATE_PRECOMMIT_CHECKOUT_OK tracked='+JSON.stringify(changed)+' added=test');
          })().catch(e=>{console.error(e);process.exitCode=1});
          
          NODE
      - name: Confirm new Story pre-answer regression fails on old candidate
        shell: bash
        run: |
          if node tests/preanswer-category-leak.test.js > /tmp/preanswer-red.log 2>&1; then
            echo 'Expected test to catch old story category disclosure, but it passed'
            exit 1
          fi
          grep -q 'J003 category/account leaked through story' /tmp/preanswer-red.log
          echo 'PASS expected RED: J003 story disclosure caught prior to patch'
      - name: Fix Story narrative category spoiler in detached candidate worktree
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file='js/view.js';
          const oldStory="if (!story.hidden) { this.byId('q-scene').textContent = question.scene; this.byId('q-context').textContent = question.story; this.byId('q-task').textContent = `今回の仕事：${visibleCategory}`; }";
          const newStory="if (!story.hidden) {\n        // Keep the story meaningful without exposing the exact answer account\n        // through a category label embedded in the narrative.\n        let visibleStory = String(question.story || '');\n        if (accountCategorySpoiler) {\n          visibleStory = visibleStory.replaceAll(`「${question.category}」に関する`, '今回の取引に関する');\n          visibleStory = visibleStory.split('。').filter(sentence => !sentence.includes(question.category)).join('。');\n        }\n        this.byId('q-scene').textContent = question.scene;\n        this.byId('q-context').textContent = visibleStory;\n        this.byId('q-task').textContent = `今回の仕事：${visibleCategory}`;\n      }";
          const source=fs.readFileSync(file,'utf8');
          if(source.split(oldStory).length!==2)throw Error('Story anchor changed or ambiguous');
          fs.writeFileSync(file,source.replace(oldStory,newStory));
          console.log('PASS third Story preanswer surface guarded without changing canonical question data');
          NODE
          node tests/preanswer-category-leak.test.js
      - name: Update obsolete Story source-only assertion with behavior-preserving contract
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),file='tests/app.test.js';
          const oldClaim="assert(viewSource.includes(\"this.byId('q-context').textContent = question.story\"), 'ストーリーモードで問題の場面と物語を表示する');";
          const newClaim="assert(viewSource.includes(\"this.byId('q-context').textContent = visibleStory\") && viewSource.includes(\"this.byId('q-scene').textContent = question.scene\"), '通常の場面と物語を表示し、正答科目に一致する物語ラベルは保護する');";
          const contents=fs.readFileSync(file,'utf8');
          if(contents.split(oldClaim).length!==2)throw Error('old assertion not uniquely identified');
          fs.writeFileSync(file,contents.replace(oldClaim,newClaim));
          console.log('PASS narrowed assertion; narrative semantics covered by full renderer test');
          NODE
      - name: Generate coherent uncommitted Release219 shell and asset hashes
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const old='20261022-218', next='20261024-219';
          const hash=f=>crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          for(const file of ['index.html','form-a.html','service-worker.js']){
            const text=fs.readFileSync(file,'utf8');
            if(!text.includes(old))throw Error(file+' missing accepted old release');
            if(text.includes(next))throw Error(file+' already updated unexpectedly');
            fs.writeFileSync(file,text.replaceAll(old,next));
          }
          const manifestPath='pwa-release-manifest.json';
          const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          if(manifest.release!==old)throw Error('manifest baseline changed');
          manifest.release=next;manifest.previousRelease=old;
          manifest.assets['js/view.js']=hash('js/view.js');
          manifest.assets['js/explanation-model.js']=hash('js/explanation-model.js');
          manifest.pages['form-a.html']=hash('form-a.html');
          fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+'\n');
          for(const [file,digest] of Object.entries(manifest.assets))
            if(hash(file)!==digest)throw Error('bad manifest hash '+file);
          for(const [file,digest] of Object.entries(manifest.pages))
            if(hash(file)!==digest)throw Error('bad page hash '+file);
          console.log('PASS precommit Release219 candidate 20/20 assets 1/1 extra page no historical change');
          NODE
      - name: Create uncommitted immutable Generation165 successor candidate
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const lifecycle=require('./scripts/qa/phase-b-lifecycle');
          const successor=lifecycle.createCandidate();
          if(successor.generation!==165||successor.predecessor.generation!==164)throw Error('Unexpected Generation lineage: '+JSON.stringify(successor.predecessor));
          const destination='reports/auto-gate/audit-locks/phase-b-generation-165.json';
          fs.mkdirSync(path.dirname(destination),{recursive:true});
          fs.writeFileSync(destination,JSON.stringify(successor,null,2)+'\n',{flag:'wx'});
          const validation=lifecycle.verifyCandidate(successor);
          if(!validation.ok)throw Error('Invalid pending successor '+JSON.stringify(validation.errors));
          if(require('./scripts/qa/audit-core').currentIntegrityCheck().ok!==true)throw Error('Pending generation is not accepted');
          console.log('PASS uncommitted Generation165 predecessor164 successor identity='+successor.baselineIdentity);
          NODE
      - name: Show restored textbook distinction coverage prior to full QA
        run: node tests/exam-points-visible.test.js
      - name: Precommit mandatory verify
        run: npm run verify
      - name: Independent educational learning-case test
        run: python3 tests/learning-effectiveness-independent.py
      - name: Independent accounting source and integrity before commit
        run: |
          python3 scripts/check-explanation-accounting.py
          npm run audit:oracle-source
          npm run qa:integrity
          git diff --check
      - name: Stage only previously reviewed product and successor files
        shell: bash
        run: |
          node <<'NODE'
          const cp=require('node:child_process');
          const files=["js/view.js","js/explanation-model.js","package.json","tests/audit-matrix.test.js","tests/app.test.js","tests/preanswer-category-leak.test.js","tests/exam-points-visible.test.js","scripts/validate-category-successor.cjs","index.html","form-a.html","service-worker.js","pwa-release-manifest.json","reports/auto-gate/audit-locks/phase-b-generation-165.json"];
          cp.execFileSync('git',['add','--',...files],{stdio:'inherit'});
          const staged=cp.execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split('\n').sort();
          const expected=[...files].sort();
          if(JSON.stringify(staged)!==JSON.stringify(expected))throw Error('staged scope drift '+JSON.stringify(staged));
          cp.execFileSync('git',['diff','--cached','--check'],{stdio:'inherit'});
          console.log('PASS exact 13-file staged candidate; protected data unchanged');
          NODE
      - name: Create checked implementation commit and verify successor ancestry
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git rev-parse HEAD)" = '8c85fbe9bdf1c529bf2bd4e7ff23cfb85140a7ec'
          git commit -m 'fix: prevent Story-mode answer disclosure and show authored exam guidance'
          echo 'DIAGNOSTIC_COMMIT_PARENT:'
          git rev-parse HEAD^
          echo 'DIAGNOSTIC_STATUS_AFTER_COMMIT:'
          git status --porcelain
          test "$(git rev-parse HEAD^)" = '8c85fbe9bdf1c529bf2bd4e7ff23cfb85140a7ec'
          node <<'NODE'
          // npm verification leaves an untracked, ephemeral artifacts/ directory.
          // Preserve every tracked file; fail closed if any OTHER file is untracked.
          const cp=require('node:child_process'),fs=require('node:fs');
          const paths=cp.execFileSync('git',['ls-files','--others','--exclude-standard'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          if(paths.some(p=>!p.startsWith('artifacts/')))throw Error('Unexpected untracked files '+JSON.stringify(paths));
          if(paths.length){
            console.log('CLEANUP only generated test artifacts',JSON.stringify(paths));
            fs.rmSync('artifacts',{recursive:true,force:true});
          }
          NODE
          test -z "$(git status --porcelain)"
          node scripts/validate-category-successor.cjs
          git show --stat --oneline HEAD
          echo "IMPLEMENTATION_HEAD=$(git rev-parse HEAD)"
          echo "IMPLEMENTATION_TREE=$(git rev-parse HEAD^{tree})"
      - name: Push implementation branch without force or altering main
        shell: bash
        run: |
          git push origin HEAD:refs/heads/feature/story-masking-teaching-20261024
