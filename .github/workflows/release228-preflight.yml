name: Release228 candidate digest preflight
on:
  push:
    branches: [feature/issue235-user-facing-copy-release228-20261029]
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Independent candidate Release manifest and immutable successor computation
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const path='pwa-release-manifest.json';
          const m=JSON.parse(fs.readFileSync(path,'utf8'));
          assert.equal(m.release,'20261028-227');
          m.previousRelease='20261028-227';m.release='20261029-228';
          for(const p of Object.keys(m.assets))m.assets[p]=sha(p);
          for(const p of Object.keys(m.pages))m.pages[p]=sha(p);
          const manifest=JSON.stringify(m,null,2)+'\n';
          fs.writeFileSync(path,manifest);
          console.log('RELEASE228_MANIFEST_BASE64 '+Buffer.from(manifest).toString('base64'));
          const phase=require('./scripts/qa/phase-b-lifecycle');
          const lock=phase.createCandidate();
          assert.equal(lock.generation,181);assert.equal(lock.predecessor.generation,180);
          const checked=phase.verifyCandidate(lock);
          assert(checked.ok,checked.errors.join(';'));
          const data=JSON.stringify(lock,null,2)+'\n';
          fs.writeFileSync('reports/auto-gate/audit-locks/phase-b-generation-181.json',data);
          console.log('RELEASE228_LOCK_BASE64 '+Buffer.from(data).toString('base64'));
          console.log('RELEASE228_DIGEST_SUCCESS ' + JSON.stringify({release:m.release,generation:lock.generation,assets:Object.keys(m.assets).length,files:Object.keys(lock.files).length}));
          NODE
      - name: Preflight reader-facing content and wording
        run: |
          node scripts/audit-user-facing-prose.cjs
          node tests/user-facing-copy-contract.test.js
          node tests/learning-recommendation-ux.test.js
