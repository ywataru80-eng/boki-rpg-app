name: Release229 editorial preflight digest temporary
on:
  push:
    branches: [feature/issue235-all300-reader-terms-release229-20261029]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compute Release229 and immutable Generation183 without committing
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const m=JSON.parse(fs.readFileSync('pwa-release-manifest.json','utf8'));
          assert.equal(m.release,'20261029-228');
          m.previousRelease=m.release;m.release='20261029-229';
          for(const p of Object.keys(m.assets))m.assets[p]=sha(p);
          for(const p of Object.keys(m.pages))m.pages[p]=sha(p);
          const json=JSON.stringify(m,null,2)+'\n';
          fs.writeFileSync('pwa-release-manifest.json',json);
          console.log('COPY229_MANIFEST_BASE64 '+Buffer.from(json).toString('base64'));
          const phase=require('./scripts/qa/phase-b-lifecycle');
          const gen=phase.createCandidate();
          assert.equal(gen.generation,183);assert.equal(gen.predecessor.generation,182);
          const check=phase.verifyCandidate(gen);
          assert(check.ok,check.errors.join(';'));
          const lock=JSON.stringify(gen,null,2)+'\n';
          fs.writeFileSync('reports/auto-gate/audit-locks/phase-b-generation-183.json',lock);
          console.log('COPY229_GEN183_BASE64 '+Buffer.from(lock).toString('base64'));
          console.log('COPY229_CANDIDATE_DIGEST_PASS');
          NODE
      - name: Per-ID 300 source/runtime language audit and key UI regression
        env:
          ALL300_AUDIT_OUTPUT: artifacts/all300-review.json
        run: |
          node scripts/audit-all300-reader-terminology.cjs
          node scripts/audit-user-facing-prose.cjs
          node tests/user-facing-copy-contract.test.js
          node tests/rpg-reward-policy.test.js
          node tests/form-a-independent.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release229-preflight-300-copy
          path: artifacts/all300-review.json
          if-no-files-found: warn
