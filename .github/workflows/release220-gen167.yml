name: Generation167 immutable successor proposal
on:
  push:
    branches: [feature/account-types-teaching-20261025]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          node - <<'NODE'
          const a=require('./scripts/qa/phase-b-lifecycle');
          const g=a.createCandidate();
          if(g.generation!==167||g.predecessor.generation!==166)throw Error('wrong 167 successor');
          const v=a.verifyCandidate(g);
          if(!v.ok)throw Error('failed candidate '+v.errors.join('; '));
          console.log('GENERATED_167_JSON='+JSON.stringify(g));
          NODE
