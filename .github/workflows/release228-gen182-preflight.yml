name: Immutable Generation182 candidate computation (temporary)
on:
  push:
    branches: [feature/issue235-user-facing-copy-release228-20261029]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require original Generation181 and compute additive Gen182
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const phase=require('./scripts/qa/phase-b-lifecycle');
          const gens=phase.generationAuthorities();
          assert.equal(gens.at(-1).document.generation,181);
          const last=gens.at(-1);
          const old=fs.readFileSync(last.file);
          assert(old.equals(last.bytes),'Gen181 edited');
          const manifest=JSON.parse(fs.readFileSync('pwa-release-manifest.json'));
          assert.equal(manifest.release,'20261029-228');
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          for(const [p,value] of Object.entries({...manifest.assets,...manifest.pages}))
            assert.equal(value,sha(p),'manifest mismatch: '+p);
          const lock=phase.createCandidate();
          assert.equal(lock.generation,182);assert.equal(lock.predecessor.generation,181);
          const verified=phase.verifyCandidate(lock);
          assert(verified.ok,verified.errors.join(';'));
          const json=JSON.stringify(lock,null,2)+'\n';
          console.log('GEN182_LOCK_BASE64 '+Buffer.from(json).toString('base64'));
          console.log('GEN182_CANDIDATE_PASS');
          NODE
