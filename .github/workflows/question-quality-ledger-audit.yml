name: Canonical300 quality ledger validation
on:
  push:
    branches: [audit/canonical300-quality-ledger-20261015, main]
    paths: ['scripts/validate-explanation-successor.cjs', 'scripts/check-explanation-accounting.py', 'tests/explanation-quality*', 'reports/edu-quality/explanation-quality-*', 'reports/edu-quality/ledger-opening-*', 'reports/edu-quality/question-quality-ledger-20261015*', '.github/workflows/question-quality-ledger-audit.yml', 'data/questions.js', 'data/accounting-domain.js', 'data/accounting-oracle.js', 'js/engine.js', 'js/view.js', 'js/feedback.js', 'js/explanation-model.js', 'js/explanation-formulas.js', 'js/explanation-design-system.js', 'js/controller.js', 'js/app.js', 'js/model.js', 'js/rpg.js', 'css/style.css', 'index.html', 'reports/edu-quality/question-taxonomy-2026.json']
  pull_request:
    paths: ['scripts/validate-explanation-successor.cjs', 'scripts/check-explanation-accounting.py', 'tests/explanation-quality*', 'reports/edu-quality/explanation-quality-*', 'reports/edu-quality/ledger-opening-*', 'reports/edu-quality/question-quality-ledger-20261015*', '.github/workflows/question-quality-ledger-audit.yml', 'data/questions.js', 'data/accounting-domain.js', 'data/accounting-oracle.js', 'js/engine.js', 'js/view.js', 'js/feedback.js', 'js/explanation-model.js', 'js/explanation-formulas.js', 'js/explanation-design-system.js', 'js/controller.js', 'js/app.js', 'js/model.js', 'js/rpg.js', 'css/style.css', 'index.html', 'reports/edu-quality/question-taxonomy-2026.json']
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/checkout@v4
        with:
          ref: 37086c6ae6511a249218533375bf6f19dac231d1
          path: historical-quality
          fetch-depth: 0
      - name: Validate immutable Release214 audit at its fixed source
        working-directory: historical-quality
        run: node reports/edu-quality/question-quality-ledger-20261015.validate.cjs
      - name: Validate immutable evidence via strict release-specific successor
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const cp = require('node:child_process');
          const manifest = require('./pwa-release-manifest.json');
          const validators = Object.freeze({
            '20261022-218': 'scripts/validate-explanation-successor.cjs',
            '20261024-219': 'scripts/validate-category-successor.cjs',
            '20261025-220': 'scripts/validate-account-nature-successor.cjs',
            '20261025-221': 'scripts/validate-special-account-reason-successor.cjs',
            '20261025-222': 'scripts/validate-story-case-successor.cjs',
            '20261025-223': 'scripts/validate-story-milestone-successor.cjs'
          });
          const script = validators[manifest.release];
          assert(script, 'unknown release: '+manifest.release);
          cp.execFileSync(process.execPath, [script], {stdio:'inherit'});
          NODE
      - name: Recalculate explanation arithmetic from source conditions
        run: python3 scripts/check-explanation-accounting.py
