name: Canonical300 quality ledger validation
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read-only check without writing the Issue 266 checkpoint'
        type: boolean
        default: true
  push:
    branches: [audit/canonical300-quality-ledger-20261015, main]
  pull_request:
    paths: ['scripts/validate-explanation-successor.cjs', 'scripts/check-explanation-accounting.py', 'tests/explanation-quality*', 'reports/edu-quality/explanation-quality-*', 'reports/edu-quality/ledger-opening-*', 'reports/edu-quality/question-quality-ledger-20261015*', '.github/workflows/question-quality-ledger-audit.yml', 'data/questions.js', 'data/accounting-domain.js', 'data/accounting-oracle.js', 'js/engine.js', 'js/view.js', 'js/feedback.js', 'js/explanation-model.js', 'js/explanation-formulas.js', 'js/explanation-design-system.js', 'js/controller.js', 'js/app.js', 'js/model.js', 'js/rpg.js', 'css/style.css', 'index.html', 'reports/edu-quality/question-taxonomy-2026.json']
permissions:
  contents: read
jobs:
  ledger:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/checkout@v4
        with:
          ref: 37086c6ae6511a249218533375bf6f19dac231d1
          path: historical-quality
          fetch-depth: 0
      - name: Validate immutable Release214 audit at its fixed source
        working-directory: historical-quality
        run: node reports/edu-quality/question-quality-ledger-20261015.validate.cjs
      - name: Validate immutable evidence via strict release-specific successor
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const cp = require('node:child_process');
          const manifest = require('./pwa-release-manifest.json');
          const validators = Object.freeze({
            '20261022-218': 'scripts/validate-explanation-successor.cjs',
            '20261024-219': 'scripts/validate-category-successor.cjs',
            '20261025-220': 'scripts/validate-account-nature-successor.cjs',
            '20261025-221': 'scripts/validate-special-account-reason-successor.cjs',
            '20261025-222': 'scripts/validate-story-case-successor.cjs',
            '20261025-223': 'scripts/validate-story-milestone-successor.cjs',
            '20261025-224': 'scripts/validate-story-bridge-successor.cjs',
            '20261026-225': 'scripts/validate-editorial-successor.cjs',
            '20261027-226': 'scripts/validate-gameplay-successor.cjs',
            '20261028-227': 'scripts/validate-investigation-successor.cjs',
            '20261029-228': 'scripts/validate-copy-successor.cjs',
            '20261029-229': 'scripts/validate-all300-copy-successor.cjs',
             '20261101-230': 'scripts/validate-reader-editorial-successor.cjs',
            '20261102-231': 'scripts/validate-reader-editorial-successor-231.cjs',
            '20261102-232': 'scripts/validate-reader-editorial-successor-232.cjs',
            '20261103-233': 'scripts/validate-reader-editorial-successor-233.cjs',
            '20261103-234': 'scripts/validate-editorial-successor-234.cjs',
            '20261105-235': 'scripts/validate-worksheet-successor-235.cjs',
            '20261107-236': 'scripts/validate-issue256-successor-236.cjs',
            '20261115-237': 'scripts/validate-story-order-category-successor-237.cjs',
            '20261116-238': 'scripts/validate-editorial-successor-238.cjs',
            '20261119-239': 'scripts/validate-fy2027-account-successor-239.cjs',
            '20261123-240': 'scripts/validate-issue259-score-successor-240.cjs',
            '20261123-241': 'scripts/validate-issue259-profile-guard-successor-241.cjs',
            '20261126-242': 'scripts/validate-j147-successor-242.cjs',
            '20261126-243': 'scripts/validate-fy2027-draft-successor-243.cjs'
          });
          const script = validators[manifest.release];
          assert(script, 'unknown release: '+manifest.release);
          cp.execFileSync(process.execPath, [script], {stdio:'inherit'});
          NODE
      - name: Recalculate explanation arithmetic from source conditions
        run: python3 scripts/check-explanation-accounting.py

  issue266_reader_audit:
    name: issue266-review-all-300
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit all 300 runtime question and explanation records
        env:
          ALL300_AUDIT_OUTPUT: artifacts/issue266-review-all-300.json
        run: |
          node scripts/audit-all300-reader-terminology.cjs
          node tests/user-facing-copy-contract.test.js
      - name: Preserve 300-question audit evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue266-all300-reader-terminology
          path: artifacts/issue266-review-all-300.json
          if-no-files-found: error

  issue266_autoresume:
    name: Issue 266 resumable checkpoint (not a coding agent)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: read
    concurrency:
      group: issue266-autoresume
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner, repo} = context.repo;
            const issue_number = 266;
            const marker = '<!-- boki-issue266-autoresume-v1 -->';
            const required = ['test', 'ledger', 'issue266-review-all-300'];
            const sha = (await github.rest.git.getRef({owner, repo, ref:'heads/main'})).data.object.sha;
            if (!/^[a-f0-9]{40}$/i.test(sha)) throw Error('Unknown main SHA');
            const [issue, pulls] = await Promise.all([
              github.rest.issues.get({owner, repo, issue_number}),
              github.rest.pulls.list({owner, repo, state:'open', per_page:100}),
            ]);
            if (pulls.data.length === 100) throw Error('Pull request pagination limit reached');
            const condition = [];
            for (const name of required) {
              let latest = null;
              for (let page = 1; page <= 250; page++) {
                const r = await github.rest.checks.listForRef({
                  owner, repo, ref:sha, check_name:name, filter:'all', per_page:100, page,
                });
                const runs = r.data.check_runs;
                const effective = runs.filter(c => c.name === name &&
                  c.conclusion !== 'skipped' && c.conclusion !== 'neutral');
                if (effective.length) {
                  latest = effective.sort((a,b) => (b.id || 0) - (a.id || 0))[0];
                  break;
                }
                if (runs.length < 100) break;
                if (page === 250) throw Error('Check-run pagination exhausted');
              }
              const healthy = latest?.status === 'completed' && latest?.conclusion === 'success';
              condition.push(name + '=' + (healthy ? 'SUCCESS' : 'NOT_GREEN'));
            }
            const duplicates = pulls.data.filter(p => p.head?.ref?.startsWith('autopilot/issue266/'));
            const approved = issue.data.labels.some(l => l.name === 'autopilot-approved');
            const blockers = [
              ...(issue.data.state === 'open' ? [] : ['issue_closed']),
              ...(condition.some(x => x.endsWith('NOT_GREEN')) ? ['main_ci_not_green'] : []),
              ...(duplicates.length ? ['autopilot_pr_already_open'] : []),
              ...(!approved ? ['owner_opt_in_missing'] : []),
              'codex_worker_not_connected',
            ];
            const body = [marker, '### 自動継続チェックポイント',
              '- main: `' + sha + '`',
              '- CI: ' + condition.join(' / '),
              '- 競合するAutopilot PR: ' + (duplicates.map(p=>'#'+p.number).join(', ') || 'なし'),
              '- 次工程の阻害要因: ' + blockers.join(' / '),
              '',
              'これは実GitHub Actionsによる状態監視です。AIによるコード改修・マージ・公開が完了した証拠ではありません。',
            ].join('\n');
            core.info(body);
            const dryRun = context.eventName === 'workflow_dispatch' && String(context.payload.inputs?.dry_run).toLowerCase() !== 'false';
            if (dryRun) return;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page:100});
            const owned = comments.filter(c=>c.user?.login==='github-actions[bot]' && c.body?.startsWith(marker));
            if (owned.length > 1) throw Error('Duplicate checkpoint markers');
            if (owned[0]?.body===body) return;
            if (owned.length)
              await github.rest.issues.updateComment({owner,repo,comment_id:owned[0].id,body});
            else
              await github.rest.issues.createComment({owner,repo,issue_number,body});
