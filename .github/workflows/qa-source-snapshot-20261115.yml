name: Temporary Release237 public Pages provenance inspection
on:
  push:
    branches:
      - audit/release237-source-snapshot-20261115
permissions:
  contents: read
jobs:
  inspect-public-pages:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch public PWA manifest without GitHub credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-pages-evidence
          url='https://ywataru80-eng.github.io/boki-rpg-app/pwa-release-manifest.json'
          status="$(curl -L --connect-timeout 15 --max-time 30 -sS -o public-pages-evidence/live-pwa-release-manifest.json -w '%{http_code}' "$url" || true)"
          export STATUS="$status"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('public-pages-evidence/live-pwa-release-manifest.json')
          record={'url':'https://ywataru80-eng.github.io/boki-rpg-app/pwa-release-manifest.json',
          'http_status':os.getenv('STATUS',''),'expected_release':'20261115-237',
          'live_release':None,'matches_expected':False}
          if record['http_status']=='200' and p.exists():
            try:
              obj=json.loads(p.read_text(encoding='utf-8'))
              record['live_release']=obj.get('release')
              record['matches_expected']=obj.get('release')==record['expected_release']
            except Exception as e: record['parse_error']=str(e)
          pathlib.Path('public-pages-evidence/provenance.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(record,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release237-public-pages-inspection-20261115
          path: public-pages-evidence/
          retention-days: 7
          if-no-files-found: warn
