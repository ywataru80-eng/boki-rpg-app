name: QA source snapshot (temporary)
on:
  push:
    branches:
      - feature/release237-gen201-story-order-preanswer-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-tracked-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive tracked source without Git credentials
        run: |
          set -euo pipefail
          mkdir -p artifacts/qa-source
          git rev-parse HEAD > artifacts/qa-source/commit-sha.txt
          # A Git bundle contains only public repository Git objects; no .git/config credentials.
          git bundle create artifacts/qa-source/history.bundle HEAD
          git bundle verify artifacts/qa-source/history.bundle
          git ls-files -z | tar --null -T - -czf artifacts/qa-source/tracked-source.tar.gz
          tar -tzf artifacts/qa-source/tracked-source.tar.gz > artifacts/qa-source/file-list.txt
          grep -Fxq 'package.json' artifacts/qa-source/file-list.txt
          grep -Fxq 'scripts/qa/phase-b-lifecycle.js' artifacts/qa-source/file-list.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qa-source-snapshot-release237
          path: artifacts/qa-source/
          if-no-files-found: error
          retention-days: 1
