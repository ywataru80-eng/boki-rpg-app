name: Temporary Release237 iPhone 13 WebKit touch calculator acceptance
on:
  push:
    branches:
      - audit/release237-source-snapshot-20261115
permissions:
  contents: read
jobs:
  ui-story-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reset test workspace to sealed PR260 head
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 87be66ecd84cf0c3976919ac95f1d8407aef8dc5
          test "$(git rev-parse HEAD)" = 87be66ecd84cf0c3976919ac95f1d8407aef8dc5
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci
      - name: Install CI-only Playwright and browser engines
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium webkit
      - name: Run genuine touchscreen input against the sealed PR260 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-audit
          git show "$GITHUB_SHA:qa-audit/run-iphone-touch-smoke.js" > qa-audit/run-iphone-touch-smoke.js
          node --check qa-audit/run-iphone-touch-smoke.js
          node qa-audit/run-iphone-touch-smoke.js
      - name: Upload full user-interface evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release237-iphone13-webkit-touch-20261115
          path: artifacts/release237-iphone-touch-emulation/
          if-no-files-found: warn
          retention-days: 7
