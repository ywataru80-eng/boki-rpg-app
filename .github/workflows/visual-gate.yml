name: browser visual gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'reports/edu-quality/question-taxonomy-2026.json'
      - '.github/visual/**'
      - 'tests/foundation-extension-contract.test.js'
      - 'tests/fixtures/foundation-extension-cases.js'
      - 'tests/helpers/foundation-extension-adapter.js'
      - '.github/workflows/visual-gate.yml'
      - 'css/**'
      - 'data/**'
      - 'js/**'
      - 'index.html'
      - 'form-a.html'
      - 'tests/form-a*.js'
      - 'tests/result-feedback-ux*.js'
      - 'tests/ledger-opening*.js'
      - 'service-worker.js'
jobs:
  physical-recovery-strict-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gate evaluator self-tests
        run: node .github/visual/gate-core.test.js && node .github/visual/harness-source.test.js
      - name: Install pinned CI-only Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run repeated same-page manual PWA update and old-tab ownership gate
        run: node .github/visual/run-pwa-manual-update.js
      - name: Run Form A independent transfer UI, persistence and PWA gate
        run: node tests/form-a.browser.test.js && node tests/form-a-pwa.browser.test.js
      - name: Run L044 L045 opening balance display and retry gate
        run: node tests/ledger-opening.browser.test.js && node tests/ledger-opening-history.browser.test.js
      - name: Run result feedback UI, accounting differences and keyboard gate
        run: node tests/result-feedback-ux.browser.test.js
      - name: Run durable learning evidence and persistence gate
        run: node .github/visual/run-learning-effectiveness.js
      - name: Run Issue256 D001-D020 actual form submit and explanation coverage
        run: node --check .github/visual/run-issue256-d001-d020.js && node .github/visual/run-issue256-d001-d020.js
      - name: Run all 300 actual browser form submit and explanation coverage
        run: node --check .github/visual/run-issue256-all300.js && node .github/visual/run-issue256-all300.js
      # Temporary self-signed TLS verifies candidate behavior over HTTPS only;
      # public GitHub Pages/iPhone acceptance must be recorded independently.
      - name: Run Issue256 candidate in ephemeral HTTPS Chromium/WebKit
        shell: bash
        run: |
          set -euo pipefail
          # A per-run local CA must be trusted by the OS, Chromium NSS,
          # and WebKit. Playwright's ignoreHTTPSErrors alone does not prove
          # Web Locks / Service Worker access on an untrusted TLS origin.
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout "$RUNNER_TEMP/issue256-ca.key" -out "$RUNNER_TEMP/issue256-ca.crt" \
            -subj '/CN=Issue256 Ephemeral CI Root' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/issue256-tls.key" -out "$RUNNER_TEMP/issue256-tls.csr" \
            -subj '/CN=localhost' >/dev/null 2>&1
          printf '%s\n' \
            'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            'extendedKeyUsage=serverAuth' \
            'basicConstraints=critical,CA:FALSE' > "$RUNNER_TEMP/issue256-tls.ext"
          openssl x509 -req -in "$RUNNER_TEMP/issue256-tls.csr" \
            -CA "$RUNNER_TEMP/issue256-ca.crt" -CAkey "$RUNNER_TEMP/issue256-ca.key" \
            -CAcreateserial -out "$RUNNER_TEMP/issue256-tls.crt" -days 1 -sha256 \
            -extfile "$RUNNER_TEMP/issue256-tls.ext" >/dev/null 2>&1
          sudo install -m 644 "$RUNNER_TEMP/issue256-ca.crt" /usr/local/share/ca-certificates/issue256-ephemeral.crt
          sudo update-ca-certificates >/dev/null
          command -v certutil >/dev/null || sudo apt-get install -y -qq libnss3-tools >/dev/null
          mkdir -p "$HOME/.pki/nssdb"
          if [ ! -f "$HOME/.pki/nssdb/cert9.db" ]; then
            certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          fi
          certutil -d "sql:$HOME/.pki/nssdb" -A -t 'C,,' \
            -n 'Issue256 Ephemeral CI Root' -i "$RUNNER_TEMP/issue256-ca.crt"
          ISSUE256_TLS_KEY="$RUNNER_TEMP/issue256-tls.key" \
          ISSUE256_TLS_CERT="$RUNNER_TEMP/issue256-tls.crt" \
          SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            node .github/visual/run-issue256-d001-d020.js --https-selfsigned
      - name: Run calculator viewport resize and input retention gate
        run: node .github/visual/run-calculator-viewport.js
      - name: Run PR 212 legacy provenance and input confirmation gate
        run: node .github/visual/run-pr212-migration.js
      - name: Run prior-release storage ownership and unavailable-origin gate
        run: node .github/visual/run-storage-upgrade.js
      - name: Run content-progress migration and reload gate
        run: node .github/visual/run-content-progress-migration.js
      - name: Run Foundation extension contract gate
        run: node .github/visual/run-foundation-extension.js
      - name: Run strict physical-recovery gate in real browsers
        run: node .github/visual/run-visual.js strict
      - name: Run explanation integration gate in real browsers
        run: node .github/visual/run-explanation-integration.js
      - name: Run progressive explanation disclosure and keyboard gate
        run: node tests/explanation-disclosure.browser.test.js && node tests/l039-explanation.browser.test.js
      - name: Run explanation P1 rendered reasoning and actual learning routes
        run: node .github/visual/run-explanation-p1.js && node .github/visual/run-explanation-p1-paths.js
      - name: Run journal explanation ticket gate in real browsers
        run: node .github/visual/run-journal-explanation-ticket.js
      - name: Run worksheet mobile gate in real browsers
        run: node .github/visual/run-worksheet-mobile.js
      - name: Run learning analysis gate in real browsers
        run: node .github/visual/run-learning-analysis.js
      - name: Run Phase 3B recommendation UX gate in real browsers
        run: node .github/visual/run-study-recommendation.js
      - name: Run Phase 5 continuity summary gate in real browsers
        run: node .github/visual/run-learning-continuity.js
      - name: Run Phase 4A RPG strategy board gate in real browsers
        run: node .github/visual/run-rpg-strategy-board.js
      - name: Run Phase 4B RPG area progression gate in real browsers
        run: node .github/visual/run-rpg-area-progression.js
      - name: Run Phase 4C reward policy gate in real browsers
        run: node .github/visual/run-rpg-reward-policy.js
      - name: Run Issue 179 S3 narrative result gate
        run: node .github/visual/run-story-narrative-result.js
      - name: Run Issue 161 all-300 state-isolation gate
        run: node .github/visual/run-state-isolation.js
      - name: Run Issue 161 explanation design-system gate
        run: node .github/visual/run-explanation-design-system.js
      - name: Run Issue 161 Chapter 1-3 explanation gate
        run: node .github/visual/run-ch1-3-explanations.js
      - name: Run Issue 161 Chapter 4-6 explanation gate
        run: node .github/visual/run-ch4-6-explanations.js
      - name: Run Issue 161 Chapter 7-8 explanation gate
        run: node .github/visual/run-ch7-8-explanations.js
      - name: Run Issue 161 Chapter 9-10 / comprehensive explanation gate
        run: node .github/visual/run-ch9-10-comprehensive-explanations.js
      - name: Run Issue 161 Chapter 11-12 final explanation gate
        run: node .github/visual/run-ch11-12-final-explanations.js
      - name: Upload screenshots and DOM metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-recovery-visual-audit
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
