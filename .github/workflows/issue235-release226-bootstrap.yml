name: Issue235 Release226 lock export
on:
  push:
    branches: [automation/issue235-release226-preparation]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Derive exact tested Generation179 from immutable Release225 source
        run: |
          set -euo pipefail
          cp scripts/prepare-release226.cjs /tmp/issue235-prepare-release226.cjs
          git fetch origin main feature/issue235-ch04-investigation-pilot automation/issue235-release226-preparation
          test "$(git rev-parse origin/main)" = "eddde65e44cc32254a27f22fa8d4f5638430be23"
          git checkout -b feature/issue235-ch04-release226 origin/main
          node /tmp/issue235-prepare-release226.cjs
          node scripts/validate-gameplay-successor.cjs
          node -e "console.log('ISSUE235_GEN179='+JSON.stringify(require('./reports/auto-gate/audit-locks/phase-b-generation-179.json')));console.log('ISSUE235_MANIFEST='+JSON.stringify(require('./pwa-release-manifest.json')))"
