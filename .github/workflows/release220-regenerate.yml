name: Release220 source hash and Generation166 recalculation (diagnostic)
on:
  push:
    branches: [feature/account-types-teaching-20261025]
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const hash=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const file='pwa-release-manifest.json',m=JSON.parse(fs.readFileSync(file,'utf8'));
          if(m.release!=='20261025-220'||m.previousRelease!=='20261024-219')throw Error('not Release220');
          for(const asset of Object.keys(m.assets))m.assets[asset]=hash(asset);
          for(const page of Object.keys(m.pages))m.pages[page]=hash(page);
          fs.writeFileSync(file,JSON.stringify(m,null,2)+'\n');
          const lc=require('./scripts/qa/phase-b-lifecycle');
          const accepted=lc.generationAuthorities().filter(g=>g.document.generation<=165);
          const gen=lc.createCandidate('B_GENERATION',accepted);
          const v=lc.verifyCandidate(gen,{generations:accepted});
          if(!v.ok||gen.generation!==166)throw Error('refuse generation: '+v.errors.join(';'));
          console.log('MANIFEST220_PAYLOAD='+JSON.stringify(m));
          console.log('GENERATION166_PAYLOAD='+JSON.stringify(gen));
          NODE
