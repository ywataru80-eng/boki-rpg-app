name: Release234 verified blob handoff
on:
  push:
    branches:
      - audit/editorial234-source-20261103
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact verified editorial patch without altering the release branch
        run: |
          set -euo pipefail
          base64 -d .handoff/editorial234.patch.gz.b64 > "$RUNNER_TEMP/editorial234.patch.gz"
          test "$(sha256sum "$RUNNER_TEMP/editorial234.patch.gz" | cut -d' ' -f1)" = d39798b22c5997151182a38e8ba24c6cb53261be3a8da8b09d3e1bdc0ef277b1
          gzip -d -c "$RUNNER_TEMP/editorial234.patch.gz" > "$RUNNER_TEMP/editorial234.patch"
          git checkout -B audit/editorial234-transfer-check c3689f0529e10519c71073acf6d75ec75bdd253a
          git apply --check "$RUNNER_TEMP/editorial234.patch"
          git apply "$RUNNER_TEMP/editorial234.patch"
          git add -u
          git add reports/auto-gate/audit-locks/phase-b-generation-188.json reports/edu-quality/editorial-content-identity-234.json scripts/validate-editorial-successor-234.cjs tests/editorial-review-234.test.js
          test "$(git write-tree)" = d69bb0740e33693ab216a35bdf7cca39e69fd1da
          test "$(git hash-object data/questions.js)" = 5da3024bae40d99b6cac739ee6bb25a0d217580e
          git diff --cached --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify content and successor candidate before any remote object creation
        run: |
          npm run verify
          npm run qa:integrity
          python3 scripts/check-explanation-accounting.py
      - name: Upload 19 verified non-workflow Git blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,sys,json,base64,subprocess,urllib.request
          repository=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          workflow='.github/workflows/question-quality-ledger-audit.yml'
          assert len(paths)==20 and workflow in paths,paths
          paths.remove(workflow)
          for path in paths:
              with open(path,'rb') as f: raw=f.read()
              body=json.dumps({'content':base64.b64encode(raw).decode('ascii'),'encoding':'base64'}).encode()
              req=urllib.request.Request('https://api.github.com/repos/'+repository+'/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=90) as result: response=json.load(result)
              expected=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert response.get('sha')==expected,(path,response.get('sha'),expected)
              print('VERIFIED_BLOB',path,expected,flush=True)
          print('VERIFIED_19_NON_WORKFLOW_BLOBS',len(paths))
          PY
